[package]
name = "blog-rust"
version = "0.1.0"
edition = "2024"

[dependencies]
argon2 = "0.6.0"
axum = "0.8.9"
chrono = { version = "0.4.45", features = ["serde"] }
dotenvy = "0.15.7"
jsonwebtoken = { version = "11.1.0", features = ["rust_crypto"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sqlx = { version = "0.9.0", features = ["runtime-tokio", "postgres", "chrono", "uuid", "macros"] }
thiserror = "2.0.21"
tokio = { version = "1.53.1", features = ["full"] }
tower-http = "0.7.1"
tracing = "0.1.44"
uuid = { version = "1.26.1", features = ["v4", "serde"] }
